mode: load_balancer

server:
  bind_address: "0.0.0.0:8484"
  workers: 2
  upstream_connect_timeout_secs: 10
  upstream_read_timeout_secs: 30

logging:
  level: info

# Three instances of the same service — identical data, each tagged with its own
# instance name so round-robin is clearly visible in responses.
upstreams:
  app_servers:
    servers:
      - "127.0.0.1:3001"   # json-server --port 3001 examples/json-server/db-lb-1.json
      - "127.0.0.1:3002"   # json-server --port 3002 examples/json-server/db-lb-2.json
      - "127.0.0.1:3003"   # json-server --port 3003 examples/json-server/db-lb-3.json
    strategy: round_robin
    tls: false
    health_check:
      interval_secs: 10
      timeout_secs: 2
      path: /instance       # each db-lb-*.json serves /instance with its own id

load_balancer:
  upstream: app_servers

control_api:
  enabled: true
  bind_address: "0.0.0.0:8485"
  api_key: "admin-key-12345"
